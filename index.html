<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#111;overflow:hidden;touch-action:none}
#wrap{position:fixed;top:0;left:0;width:100vw;height:100vh;overflow:hidden;cursor:crosshair;user-select:none;-webkit-user-select:none}
#sky{position:absolute;inset:0;z-index:0}
#ground{position:absolute;bottom:0;left:0;right:0;height:18%;z-index:1}
#ground::before{content:'';position:absolute;top:0;left:0;right:0;height:6px;background:repeating-linear-gradient(90deg,#2d7d36 0,#2d7d36 8px,#3a9e44 8px,#3a9e44 16px)}
#wx{position:absolute;inset:0;pointer-events:none;z-index:2}
#hud{position:absolute;bottom:0;left:0;right:0;height:18%;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(8px,2vw,24px);pointer-events:none;z-index:10}
.hbox{background:rgba(0,0,0,0.75);border:2px solid #f5c842;padding:4px 8px;font-family:'Press Start 2P',monospace;font-size:clamp(8px,1.4vw,16px);color:#f0ece0;line-height:1.7}
.hl{color:#f5c842;font-size:.75em}
#shots-row{display:flex;gap:4px}
.blt{width:clamp(8px,1.2vw,14px);height:clamp(12px,1.8vw,20px);background:#f5c842;border-radius:2px 2px 0 0}
.blt.used{background:#555}
.duck{position:absolute;cursor:crosshair;z-index:5;image-rendering:pixelated}
.duck canvas{display:block;image-rendering:pixelated}
#flash{position:absolute;inset:0;background:rgba(255,255,255,.5);opacity:0;pointer-events:none;z-index:20;transition:opacity .08s}
.floater{position:absolute;font-family:'Press Start 2P',monospace;font-size:clamp(10px,1.8vw,20px);pointer-events:none;z-index:15;-webkit-animation:pop .7s forwards;animation:pop .7s forwards}
@-webkit-keyframes pop{0%{-webkit-transform:translateY(0);opacity:1}100%{-webkit-transform:translateY(-40px);opacity:0}}
@keyframes pop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}
.duck.falling{pointer-events:none;-webkit-animation:dfall 1.8s forwards;animation:dfall 1.8s forwards}
@-webkit-keyframes dfall{
  0%  {-webkit-transform:translateY(0) rotate(0deg);opacity:1}
  40% {-webkit-transform:translateY(60px) rotate(-20deg);opacity:1}
  65% {-webkit-transform:translateY(120px) rotate(10deg);opacity:1}
  80% {-webkit-transform:translateY(160px) rotate(0deg);opacity:1}
  90% {-webkit-transform:translateY(170px) rotate(0deg);opacity:1}
  100%{-webkit-transform:translateY(170px) rotate(0deg);opacity:0}
}
@keyframes dfall{
  0%  {transform:translateY(0) rotate(0deg);opacity:1}
  40% {transform:translateY(60px) rotate(-20deg);opacity:1}
  65% {transform:translateY(120px) rotate(10deg);opacity:1}
  80% {transform:translateY(160px) rotate(0deg);opacity:1}
  90% {transform:translateY(170px) rotate(0deg);opacity:1}
  100%{transform:translateY(170px) rotate(0deg);opacity:0}
}
#overlay{position:absolute;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;gap:14px;padding:20px;text-align:center}
#overlay h1{font-family:'Press Start 2P',monospace;font-size:clamp(20px,5vw,52px);color:#f5c842;text-shadow:3px 3px 0 #000,-1px -1px 0 #a00;line-height:1.5}
#overlay p{font-family:'VT323',monospace;font-size:clamp(20px,3.5vw,38px);color:#f0ece0;line-height:1.6}
#overlay button,#quit-btn{font-family:'Press Start 2P',monospace;font-size:clamp(12px,2vw,20px);background:#f5c842;color:#000;border:none;border-bottom:4px solid #a07800;padding:clamp(10px,1.5vh,18px) clamp(18px,3vw,36px);cursor:pointer;-webkit-tap-highlight-color:transparent}
#overlay button:active,#quit-btn:active{-webkit-transform:translateY(3px);transform:translateY(3px);border-bottom-width:1px}
#quit-btn{position:absolute;top:clamp(6px,1vh,14px);right:clamp(8px,1.5vw,18px);z-index:40;background:#e83030;color:#fff;border-bottom-color:#800;padding:clamp(4px,.8vh,8px) clamp(8px,1.2vw,14px);display:none}
#rb{position:absolute;top:14%;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);font-family:'Press Start 2P',monospace;font-size:clamp(10px,2.2vw,24px);color:#f5c842;text-shadow:2px 2px 0 #000;background:rgba(0,0,0,.7);padding:clamp(4px,1vh,10px) clamp(10px,2vw,20px);pointer-events:none;z-index:25;opacity:0;transition:opacity .3s}
#rb.show{opacity:1}
#wb{position:absolute;top:28%;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);font-family:'Press Start 2P',monospace;font-size:clamp(10px,1.8vw,18px);color:#fff;text-shadow:2px 2px 0 #f5c842;background:rgba(0,0,0,.8);border:2px solid #f5c842;padding:clamp(8px,1.5vh,16px) clamp(14px,2.5vw,28px);z-index:25;pointer-events:none;display:none;text-align:center;line-height:2}
#dog{position:absolute;bottom:18%;left:clamp(8px,3vw,40px);z-index:6;display:none;line-height:0}
#dog.dead{-webkit-animation:dogdie 0.4s forwards;animation:dogdie 0.4s forwards;pointer-events:none}
@-webkit-keyframes dogdie{0%{-webkit-transform:rotate(0);opacity:1}60%{-webkit-transform:rotate(85deg);opacity:1}100%{-webkit-transform:rotate(90deg) translateY(8px);opacity:0.85}}
@keyframes dogdie{0%{transform:rotate(0);opacity:1}60%{transform:rotate(85deg);opacity:1}100%{transform:rotate(90deg) translateY(8px);opacity:0.85}}
#back{position:absolute;top:clamp(6px,1vh,12px);left:clamp(8px,1.5vw,16px);font-family:'Press Start 2P',monospace;font-size:clamp(7px,1vw,12px);color:rgba(0,0,0,.5);text-decoration:none;z-index:40}
</style>

<body>
<div id="wrap">
  <a href="https://augustineiacopelli.github.io/appaday/" id="back">&#x2190; AppADay</a>
  <div id="sky"></div>

  <div id="dog" style="width:clamp(48px,8vmin,96px);height:clamp(48px,8vmin,96px)"><canvas id="dogc" width="48" height="48" style="display:block;width:100%;height:100%;image-rendering:pixelated"></canvas></div>
  <div id="hud">
    <div class="hbox"><div class="hl">SCORE</div><div id="sc">0</div></div>

    <h1>DUCK<br>SEASON</h1>

<script>
// ---- Compat helpers ----
function shade(hex,p){var n=parseInt(hex.replace('#',''),16),r=Math.min(255,Math.max(0,(n>>16)+p)),g=Math.min(255,Math.max(0,((n>>8)&255)+p)),b=Math.min(255,Math.max(0,(n&255)+p));return '#'+[r,g,b].map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
function rrect(ctx,x,y,w,h,r){var q=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+q,y);ctx.lineTo(x+w-q,y);ctx.arcTo(x+w,y,x+w,y+h,q);ctx.lineTo(x+w,y+h-q);ctx.arcTo(x+w,y+h,x,y+h,q);ctx.lineTo(x+q,y+h);ctx.arcTo(x,y+h,x,y,q);ctx.lineTo(x,y+q);ctx.arcTo(x,y,x+w,y,q);ctx.closePath()}
function el(id){return document.getElementById(id)}

// ---- Duck sprite (24x24 canvas) ----
function drawDuck(ctx,flip,col,wf){
  var W=24,H=24;
  ctx.clearRect(0,0,W,H);
  var c=col||'#27ae60',dk=shade(c,-45),md=shade(c,-22),hi=shade(c,30);
  var wingY=wf===0?9:wf===1?12:15;
  var wa=wf===0?-0.4:wf===1?0:0.4;
  ctx.save();
  if(flip){ctx.translate(W,0);ctx.scale(-1,1);}
  // tail
  ctx.fillStyle=dk;ctx.beginPath();ctx.moveTo(4,13);ctx.lineTo(1,10);ctx.lineTo(3,16);ctx.closePath();ctx.fill();
  // body
  ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(12,14,8,5,0,0,Math.PI*2);ctx.fill();
  // wing
  ctx.fillStyle=md;ctx.beginPath();ctx.ellipse(11,wingY,6,3,wa,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=hi;ctx.beginPath();ctx.ellipse(10,wingY-1,3,1.5,wa,0,Math.PI*2);ctx.fill();
  // neck+head
  ctx.fillStyle=c;ctx.fillRect(16,9,4,5);
  ctx.fillStyle=dk;ctx.beginPath();ctx.arc(19,8,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=hi;ctx.beginPath();ctx.arc(18,6,1.5,0,Math.PI*2);ctx.fill();
  // beak
  ctx.fillStyle='#f5a623';ctx.beginPath();ctx.moveTo(22,8);ctx.lineTo(24,9);ctx.lineTo(22,10);ctx.closePath();ctx.fill();
  // eye
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(20,7,1.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(20.4,7,0.8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(20,6,1,1);
  // feet
  ctx.fillStyle='#f5a623';ctx.fillRect(10,19,2,3);ctx.fillRect(9,21,4,1);ctx.fillRect(14,19,2,3);ctx.fillRect(13,21,4,1);
  ctx.restore();
}

// ---- Dog sprite (48x48 canvas) ----
function drawDog(ctx,f){
  ctx.clearRect(0,0,48,48);
  var by=20+(f%2===0?0:1),hy;
  // shadow
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(24,46,14,3,0,0,Math.PI*2);ctx.fill();
  // body
  ctx.fillStyle='#c8780a';rrect(ctx,8,by,32,18,4);ctx.fill();
  // belly
  ctx.fillStyle='#e8a84a';ctx.beginPath();ctx.ellipse(24,by+10,10,7,0,0,Math.PI*2);ctx.fill();
  // tail
  ctx.fillStyle='#c8780a';ctx.save();ctx.translate(40,by+6);ctx.rotate(f<2?-0.4:0.4);ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(8,-8,10,-2);ctx.quadraticCurveTo(6,2,0,4);ctx.closePath();ctx.fill();ctx.restore();
  // legs
  ctx.fillStyle='#c8780a';rrect(ctx,11,by+14,6,12,2);ctx.fill();rrect(ctx,31,by+14,6,12,2);ctx.fill();
  // paws
  ctx.fillStyle='#e8a84a';ctx.beginPath();ctx.ellipse(14,by+27,4,2.5,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(34,by+27,4,2.5,0,0,Math.PI*2);ctx.fill();
  // neck
  ctx.fillStyle='#c8780a';ctx.fillRect(18,by-6,12,8);
  // head
  hy=by-18+(f%2===0?0:-2);
  ctx.fillStyle='#c8780a';rrect(ctx,12,hy,24,20,6);ctx.fill();
  // ears
  ctx.fillStyle='#a85c06';ctx.save();ctx.translate(13,hy+2);ctx.rotate(f<2?0.15:-0.1);ctx.beginPath();ctx.ellipse(0,6,4,8,-0.2,0,Math.PI*2);ctx.fill();ctx.restore();
  ctx.save();ctx.translate(35,hy+2);ctx.rotate(f<2?-0.15:0.1);ctx.beginPath();ctx.ellipse(0,6,4,8,0.2,0,Math.PI*2);ctx.fill();ctx.restore();
  // snout
  ctx.fillStyle='#e8c070';rrect(ctx,16,hy+10,16,10,4);ctx.fill();
  // nose
  ctx.fillStyle='#3a1a00';ctx.beginPath();ctx.ellipse(24,hy+12,4,3,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#7a3a10';ctx.beginPath();ctx.ellipse(23,hy+11,1.5,1,0,0,Math.PI*2);ctx.fill();
  // mouth
  ctx.fillStyle='#3a1a00';
  if(f%2===0){ctx.beginPath();ctx.moveTo(16,hy+16);ctx.quadraticCurveTo(24,hy+22,32,hy+16);ctx.lineTo(30,hy+18);ctx.quadraticCurveTo(24,hy+24,18,hy+18);ctx.closePath();ctx.fill();ctx.fillStyle='#e05060';ctx.beginPath();ctx.ellipse(24,hy+20,5,3,0,0,Math.PI*2);ctx.fill();}
  else{ctx.beginPath();ctx.moveTo(17,hy+16);ctx.quadraticCurveTo(24,hy+20,31,hy+16);ctx.lineTo(30,hy+17);ctx.quadraticCurveTo(24,hy+21,18,hy+17);ctx.closePath();ctx.fill();ctx.fillStyle='#e05060';ctx.beginPath();ctx.ellipse(24,hy+18,4,2,0,0,Math.PI*2);ctx.fill();}
  // eyes
  if(f%2===0){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(19,hy+6,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(29,hy+6,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(19.5,hy+6,1.8,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(29.5,hy+6,1.8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(19,hy+4,2,2);ctx.fillRect(29,hy+4,2,2);}
  else{ctx.strokeStyle='#3a1a00';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(16,hy+5);ctx.lineTo(22,hy+8);ctx.stroke();ctx.beginPath();ctx.moveTo(22,hy+5);ctx.lineTo(16,hy+8);ctx.stroke();ctx.beginPath();ctx.moveTo(26,hy+5);ctx.lineTo(32,hy+8);ctx.stroke();ctx.beginPath();ctx.moveTo(32,hy+5);ctx.lineTo(26,hy+8);ctx.stroke();}
}

// ---- Weather scenes ----
var SCENES=[
  {n:'Sunny Day',    s1:'#5bc8f5',s2:'#a8e4f8',g1:'#3a9e44',g2:'#2d7d36',g3:'#8B6914',wx:null},
  {n:'Golden Hour',  s1:'#ff7c2a',s2:'#ffd580',g1:'#4a7a28',g2:'#2d5c1a',g3:'#6b4c10',wx:null},
  {n:'Overcast',     s1:'#7a8a9a',s2:'#b0bec5',g1:'#5a7a3a',g2:'#3a5a28',g3:'#7a6040',wx:null},
  {n:'Rainy',        s1:'#3a4a5a',s2:'#5a6a7a',g1:'#2a5a2a',g2:'#1a3a1a',g3:'#4a3a28',wx:'rain'},
  {n:'Night Hunt',   s1:'#0a0a1e',s2:'#1a1a3a',g1:'#1a3a1a',g2:'#0a1a0a',g3:'#2a1a08',wx:'stars'},
  {n:'Stormy',       s1:'#1a1a2a',s2:'#2a3040',g1:'#1e3a1e',g2:'#0e220e',g3:'#2a1e0a',wx:'lightning'},
  {n:'Foggy Dawn',   s1:'#c8d8e8',s2:'#e8f0f8',g1:'#4a6a3a',g2:'#2a4a28',g3:'#6a5030',wx:'fog'},
  {n:'Blizzard',     s1:'#b0c0d8',s2:'#d8e4f0',g1:'#c8d8e0',g2:'#a0b8c8',g3:'#b0bac8',wx:'snow'}
];
var DUCK_COLORS=['#27ae60','#e74c3c','#2980b9','#8e44ad','#e67e22','#16a085'];
var SPEEDS=[3.5,4.5,5.5,6.8,8.2,9.8,11.5,13.0];
var SHOTS_PER_WAVE=3, WAVES_PER_ROUND=5;

function ducksPerWave(r){return r<=8?1:r<=16?2:3;}

// ---- Particles ----
var particles=[], clouds=[], wxTick=0;
function initClouds(W){
  clouds=[];
  for(var i=0;i<4;i++) clouds.push({x:Math.random()*W,y:0.06+Math.random()*0.22,w:60+Math.random()*60,h:20+Math.random()*18,spd:0.12+Math.random()*0.18});
}
function initParticles(type,W,H){
  particles=[];
  if(type==='rain'){for(var i=0;i<80;i++) particles.push({x:Math.random()*W,y:Math.random()*H,spd:6+Math.random()*5,len:10+Math.random()*8,drift:1.5});}
  else if(type==='snow'){for(var i=0;i<60;i++) particles.push({x:Math.random()*W,y:Math.random()*H,spd:0.8+Math.random()*1.2,r:2+Math.random()*3,drift:(Math.random()-0.5)*0.6});}
  else if(type==='stars'){for(var i=0;i<55;i++) particles.push({x:Math.random()*W,y:Math.random()*H*0.75,r:0.5+Math.random()*1.5,tw:Math.random()*Math.PI*2});}
  else if(type==='lightning'){for(var i=0;i<3;i++) particles.push({px:0.2+Math.random()*0.6,timer:Math.random()*200,iv:120+Math.random()*180,active:false,alpha:0});}
  else if(type==='fog'){for(var i=0;i<5;i++) particles.push({x:Math.random()*W,y:H*(0.3+Math.random()*0.4),w:120+Math.random()*160,h:30+Math.random()*40,spd:0.2+Math.random()*0.3});}
}

var wxCanvas=null,wxCtx=null,curScene=null;

function applyScene(idx){
  var s=SCENES[idx%SCENES.length];
  curScene=s;
  el('sky').style.background='linear-gradient(to bottom,'+s.s1+','+s.s2+')';
  el('ground').style.background='linear-gradient(to bottom,'+s.g1+' 0%,'+s.g2+' 40%,'+s.g3+' 100%)';
  var W=wrap.offsetWidth,H=wrap.offsetHeight;
  initClouds(W); initParticles(s.wx,W,H);
  if(wxCanvas){wxCanvas.width=W;wxCanvas.height=H;}
  // scene name flash
  var lbl=document.createElement('div');
  lbl.textContent=s.n;
  lbl.style.position='absolute';lbl.style.top='12%';lbl.style.left='50%';
  lbl.style.webkitTransform='translateX(-50%)';lbl.style.transform='translateX(-50%)';
  lbl.style.fontFamily="'Press Start 2P',monospace";lbl.style.fontSize='clamp(7px,1.8vw,11px)';
  lbl.style.color='#fff';lbl.style.textShadow='1px 1px 0 #000';lbl.style.background='rgba(0,0,0,.5)';
  lbl.style.padding='3px 10px';lbl.style.pointerEvents='none';lbl.style.zIndex='26';
  lbl.style.webkitAnimation='pop 1.8s forwards';lbl.style.animation='pop 1.8s forwards';
  wrap.appendChild(lbl);
  setTimeout(function(){if(lbl.parentNode)lbl.parentNode.removeChild(lbl);},1800);
}

function drawWeather(dt){
  if(!wxCanvas||!curScene)return;
  var W=wxCanvas.width,H=wxCanvas.height,i,p,c;
  wxCtx.clearRect(0,0,W,H);
  wxTick+=dt;
  var s=curScene;
  // clouds — one ellipse per beginPath
  var cc=s.wx==='night'?'rgba(40,40,80,.7)':s.wx==='stormy'?'rgba(60,70,90,.9)':'rgba(255,255,255,.85)';
  for(i=0;i<clouds.length;i++){
    c=clouds[i];c.x+=c.spd*(dt/16);if(c.x>W+c.w)c.x=-c.w;
    wxCtx.fillStyle=cc;
    wxCtx.beginPath();wxCtx.ellipse(c.x,H*c.y,c.w*.5,c.h*.45,0,0,Math.PI*2);wxCtx.fill();
    wxCtx.beginPath();wxCtx.ellipse(c.x-c.w*.22,H*c.y+c.h*.1,c.w*.3,c.h*.35,0,0,Math.PI*2);wxCtx.fill();
    wxCtx.beginPath();wxCtx.ellipse(c.x+c.w*.22,H*c.y+c.h*.05,c.w*.28,c.h*.32,0,0,Math.PI*2);wxCtx.fill();
  }
  if(s.wx==='rain'){
    wxCtx.strokeStyle='rgba(160,200,255,.55)';wxCtx.lineWidth=1;
    for(i=0;i<particles.length;i++){p=particles[i];p.y+=p.spd*(dt/16);p.x+=p.drift*(dt/16);if(p.y>H){p.y=-p.len;p.x=Math.random()*W;}wxCtx.beginPath();wxCtx.moveTo(p.x,p.y);wxCtx.lineTo(p.x+p.drift*2,p.y+p.len);wxCtx.stroke();}
  } else if(s.wx==='snow'){
    wxCtx.fillStyle='rgba(230,240,255,.85)';
    for(i=0;i<particles.length;i++){p=particles[i];p.y+=p.spd*(dt/16);p.x+=p.drift+Math.sin(wxTick*.002+p.x)*.3;if(p.y>H){p.y=-4;p.x=Math.random()*W;}wxCtx.beginPath();wxCtx.arc(p.x,p.y,p.r,0,Math.PI*2);wxCtx.fill();}
  } else if(s.wx==='stars'){
    for(i=0;i<particles.length;i++){p=particles[i];p.tw+=0.04;var a=0.5+0.5*Math.sin(p.tw);wxCtx.fillStyle='rgba(255,255,220,'+a+')';wxCtx.beginPath();wxCtx.arc(p.x,p.y,p.r,0,Math.PI*2);wxCtx.fill();}
    // moon — two separate arcs
    wxCtx.fillStyle='rgba(255,250,200,.9)';wxCtx.beginPath();wxCtx.arc(W*.82,H*.12,18,0,Math.PI*2);wxCtx.fill();
    wxCtx.fillStyle='rgba(10,10,30,.85)';wxCtx.beginPath();wxCtx.arc(W*.85,H*.10,15,0,Math.PI*2);wxCtx.fill();
  } else if(s.wx==='lightning'){
    for(i=0;i<particles.length;i++){p=particles[i];p.timer+=dt;if(p.timer>p.iv){p.timer=0;p.active=true;p.alpha=1.0;p.iv=100+Math.random()*250;}if(p.active){p.alpha-=0.06*(dt/16);if(p.alpha<=0){p.active=false;}else{var lx=W*p.px,cy2=0,cx2=lx;wxCtx.save();wxCtx.globalAlpha=p.alpha*.8;wxCtx.strokeStyle='#d0e8ff';wxCtx.lineWidth=2;wxCtx.shadowColor='#88bbff';wxCtx.shadowBlur=8;wxCtx.beginPath();wxCtx.moveTo(lx,0);while(cy2<H*.65){cy2+=12+Math.random()*10;cx2+=(Math.random()-.5)*22;wxCtx.lineTo(cx2,cy2);}wxCtx.stroke();wxCtx.restore();}}}
  } else if(s.wx==='fog'){
    for(i=0;i<particles.length;i++){p=particles[i];p.x+=p.spd*(dt/16);if(p.x>W+p.w)p.x=-p.w;var fg=wxCtx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.w*.5);fg.addColorStop(0,'rgba(220,230,240,.18)');fg.addColorStop(1,'rgba(220,230,240,0)');wxCtx.fillStyle=fg;wxCtx.beginPath();wxCtx.ellipse(p.x,p.y,p.w*.5,p.h*.5,0,0,Math.PI*2);wxCtx.fill();}
  }
}

// ---- Game state ----
var score=0,gameRound=1,wavesThisRound=0,ducksHit=0;
var shotsLeft=SHOTS_PER_WAVE,waveAlive=0;
var ducks=[],running=false,raf=null,lastT=0;
var dogTimer=null,dogFrame=0,dogInterval=null;
var dogDead=false;
var highScore=0;
var roundShotsFired=0,roundShotsMissed=0;

var wrap=el('wrap');

function renderShots(){
  var row=el('shots-row');row.innerHTML='';
  for(var i=0;i<SHOTS_PER_WAVE;i++){var b=document.createElement('div');b.className='blt'+(i>=shotsLeft?' used':'');row.appendChild(b);}
}
function wW(){return wrap.offsetWidth;}
function wH(){return wrap.offsetHeight;}
var GF=0.18;

function startDog(){dogFrame=0;dogInterval=setInterval(function(){dogFrame=(dogFrame+1)%4;drawDog(el('dogc').getContext('2d'),dogFrame);},120);}
function stopDog(){if(dogInterval){clearInterval(dogInterval);dogInterval=null;}el('dog').style.display='none';}
function shootDog(){
  if(dogDead)return;
  dogDead=true;
  if(dogTimer)clearTimeout(dogTimer);
  stopDog();
  var penalty=200*gameRound;
  score=Math.max(0,score-penalty);
  el('sc').textContent=score;
  // tip over animation
  var dogDiv=el('dog');
  dogDiv.classList.add('dead');
  // penalty floater
  var f=document.createElement('div');f.className='floater';
  f.style.color='#e83030';f.style.textShadow='1px 1px 0 #000';
  f.textContent='-'+penalty+' BAD DOG!';
  f.style.left='6%';f.style.top='60%';f.style.fontSize='clamp(8px,2vw,13px)';
  wrap.appendChild(f);
  setTimeout(function(){if(f.parentNode)f.parentNode.removeChild(f);},1200);
  setTimeout(function(){dogDiv.style.display='none';dogDiv.classList.remove('dead');},1800);
}
function showDog(){
  if(dogDead)return;
  var dogDiv=el('dog');
  dogDiv.style.display='block';
  dogDiv.classList.remove('dead');
  startDog();
  if(dogTimer)clearTimeout(dogTimer);
  dogTimer=setTimeout(function(){stopDog();},2200);
}

// ---- Spawn duck ----
function spawnDuck(delay){
  if(!running)return;
  setTimeout(function(){
    if(!running)return;
    var W=wW(),H=wH();
    var div=document.createElement('div');
    div.className='duck';
    var c=document.createElement('canvas');
    c.width=24;c.height=24;
    var ds=Math.min(W,H)*.09;
    div.style.width=ds+'px';div.style.height=ds+'px';
    c.style.width='100%';c.style.height='100%';
    div.appendChild(c);wrap.appendChild(div);

    var flip=Math.random()>.5;
    var col=DUCK_COLORS[Math.floor(Math.random()*DUCK_COLORS.length)];
    drawDuck(c.getContext('2d'),flip,col,0);

    var spd=SPEEDS[Math.min(gameRound-1,SPEEDS.length-1)];
    var vx=flip?-(spd+Math.random()*1.5):(spd+Math.random()*1.5);
    var vy=(Math.random()-.5)*spd*.7;
    var maxY=H*(1-GF)-ds-4;
    var x=flip?W+10:-ds-10;
    var y=Math.random()*(maxY-H*.08)+H*.05;
    div.style.left=x+'px';div.style.top=y+'px';

    var duck={div:div,c:c,x:x,y:y,vx:vx,vy:vy,flip:flip,col:col,alive:true,escaping:false,wf:0,wt:0};
    ducks.push(duck);

    div.addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();hitDuck(duck);},{passive:false});
    div.addEventListener('mousedown',function(e){e.stopPropagation();hitDuck(duck);});
  },delay);
}

function hitDuck(duck){
  if(!running||!duck.alive||duck.escaping)return;
  duck.alive=false;waveAlive--;ducksHit++;roundShotsFired++;
  var pts=100*gameRound;score+=pts;el('sc').textContent=score;

  var f=document.createElement('div');f.className='floater';f.style.color='#f5c842';f.style.textShadow='1px 1px 0 #000';f.textContent='+'+pts;f.style.left=duck.x+'px';f.style.top=duck.y+'px';wrap.appendChild(f);
  setTimeout(function(){if(f.parentNode)f.parentNode.removeChild(f);},700);

  el('flash').style.opacity='1';setTimeout(function(){el('flash').style.opacity='0';},80);
  duck.div.classList.add('falling');
  setTimeout(function(){if(duck.div.parentNode)duck.div.parentNode.removeChild(duck.div);ducks=ducks.filter(function(d){return d!==duck;});},1900);

  renderShots();
  if(waveAlive<=0)endWave();
}

function onMiss(cx,cy){
  if(!running)return;
  var hasLive=false;
  for(var i=0;i<ducks.length;i++){if(ducks[i].alive&&!ducks[i].escaping){hasLive=true;break;}}
  if(!hasLive)return;
  shotsLeft--;roundShotsFired++;roundShotsMissed++;renderShots();

  var m=document.createElement('div');m.className='floater';m.style.color='#e83030';m.style.textShadow='1px 1px 0 #000';m.textContent='MISS';m.style.left=(cx-16)+'px';m.style.top=(cy-10)+'px';wrap.appendChild(m);
  setTimeout(function(){if(m.parentNode)m.parentNode.removeChild(m);},600);

  if(shotsLeft<=0){
    for(var i=0;i<ducks.length;i++){if(ducks[i].alive&&!ducks[i].escaping){ducks[i].escaping=true;waveAlive--;}}
    showDog();endWave();
  }
}

function endWave(){
  wavesThisRound++;shotsLeft=SHOTS_PER_WAVE;renderShots();
  if(wavesThisRound>=WAVES_PER_ROUND){
    var missRate=roundShotsFired>0?(roundShotsMissed/roundShotsFired):0;
    if(missRate>0.5){setTimeout(gameOver,900);}
    else{setTimeout(nextRound,900);}
  } else {
    setTimeout(function(){if(running)spawnWave();},700);
  }
}

function spawnWave(){
  if(!running)return;
  shotsLeft=SHOTS_PER_WAVE;renderShots();
  var n=ducksPerWave(gameRound);waveAlive=n;
  for(var i=0;i<n;i++)spawnDuck(i*320);
}

function winGame(){
  running=false;if(raf)cancelAnimationFrame(raf);
  for(var i=0;i<ducks.length;i++){try{if(ducks[i].div.parentNode)ducks[i].div.parentNode.removeChild(ducks[i].div);}catch(e){}}
  ducks=[];stopDog();
  // save high score
  if(score>highScore)highScore=score;
  var isNew=score>=highScore;
  el('quit-btn').style.display='none';
  el('overlay').style.display='flex';
  el('overlay').innerHTML=
    '<h1 style="color:#f5c842;font-size:clamp(13px,4vw,22px);line-height:1.6">YOU<br>WIN!</h1>'+
    '<p style="color:#f5c842;font-size:clamp(14px,3.5vw,22px)">ALL 24 ROUNDS CLEAR!</p>'+
    '<p style="font-family:VT323,monospace;font-size:clamp(18px,4vw,26px);color:#f0ece0;line-height:1.8">'+
    'FINAL SCORE: '+score+'<br>'+
    'DUCKS HIT: '+ducksHit+'<br>'+
    (isNew?'<span style="color:#f5c842">&#x2605; NEW HIGH SCORE! &#x2605;</span>':'BEST: '+highScore)+
    '</p>'+
    '<button id="play-btn">PLAY AGAIN</button>';
  el('play-btn').addEventListener('click',function(){
    renderHSDisplay();
    startGame();
  });
}

function gameOver(){
  running=false;if(raf)cancelAnimationFrame(raf);
  for(var i=0;i<ducks.length;i++){try{if(ducks[i].div.parentNode)ducks[i].div.parentNode.removeChild(ducks[i].div);}catch(e){}}
  ducks=[];stopDog();
  if(score>highScore)highScore=score;
  el('quit-btn').style.display='none';
  var pct=roundShotsFired>0?Math.round((roundShotsMissed/roundShotsFired)*100):0;
  el('overlay').style.display='flex';
  el('overlay').innerHTML=
    '<h1 style="color:#e83030">GAME<br>OVER</h1>'+
    '<p style="font-family:VT323,monospace;font-size:clamp(18px,4vw,26px);color:#f0ece0;line-height:1.8">'+
    'ROUND '+gameRound+' • '+pct+'% MISS RATE<br>'+
    'SCORE: '+score+'<br>DUCKS HIT: '+ducksHit+'<br>'+
    (highScore>0?'BEST: '+highScore:'')+
    '</p>'+
    '<button id="play-btn">PLAY AGAIN</button>';
  el('play-btn').addEventListener('click',function(){renderHSDisplay();startGame();});
}

function nextRound(){
  // check win condition before incrementing
  if(gameRound>=24){winGame();return;}
  gameRound++;wavesThisRound=0;dogDead=false;roundShotsFired=0;roundShotsMissed=0;el('rd').textContent=gameRound;
  applyScene((gameRound-1)%SCENES.length);
  var prev=ducksPerWave(gameRound-1),cur=ducksPerWave(gameRound);
  var wbMsg='ROUND '+(gameRound-1)+' CLEAR!<br>'+ducksHit+' DUCKS HIT<br>GET READY FOR ROUND '+gameRound;
  if(cur>prev) wbMsg+='<br><span style="color:#e83030">'+cur+' DUCKS AT ONCE!</span>';
  el('wb').innerHTML=wbMsg;
  el('wb').style.display='block';
  el('rb').textContent='ROUND '+gameRound;
  setTimeout(function(){el('rb').className='show';},400);
  setTimeout(function(){el('rb').className='';},1900);
  if(gameRound>=3)el('quit-btn').style.display='block';
  setTimeout(function(){el('wb').style.display='none';if(running)spawnWave();},2500);
}

// ---- Game loop ----
function loop(ts){
  if(!running)return;
  var dt=Math.min(ts-(lastT||ts),50);lastT=ts;
  var W=wW(),H=wH(),top=H*.04,bot=H*(1-GF)-52;
  drawWeather(dt);
  for(var i=0;i<ducks.length;i++){
    var d=ducks[i];
    if(!d.alive&&!d.escaping)continue;
    d.x+=d.vx*(dt/16);d.y+=d.vy*(dt/16);
    if(d.escaping){
      d.vy*=.97;
      if(d.x<-90||d.x>W+90){d.alive=false;d.escaping=false;if(d.div.parentNode)d.div.parentNode.removeChild(d.div);ducks.splice(i,1);i--;}
      else{d.div.style.left=d.x+'px';d.div.style.top=d.y+'px';}
      continue;
    }
    // wall bounce
    if(d.x<-8){d.x=-8;d.vx=Math.abs(d.vx);d.flip=false;drawDuck(d.c.getContext('2d'),false,d.col,d.wf<3?d.wf:1);}
    if(d.x>W-52){d.x=W-52;d.vx=-Math.abs(d.vx);d.flip=true;drawDuck(d.c.getContext('2d'),true,d.col,d.wf<3?d.wf:1);}
    if(d.y<top){d.y=top;d.vy=Math.abs(d.vy)+.3;}
    if(d.y>bot){d.y=bot;d.vy=-(Math.abs(d.vy)+.3);}
    // turbulence
    var spd=SPEEDS[Math.min(gameRound-1,SPEEDS.length-1)];
    d.vy+=(Math.random()-.5)*.35;d.vx+=(Math.random()-.5)*.18;
    if(Math.random()<.04+(gameRound-1)*.008)d.vy=(Math.random()-.5)*spd*1.4;
    if(Math.random()<.018){var dir=d.vx>0?1:-1;d.vx=dir*spd*(.6+Math.random());}
    var mx=spd*1.6;if(Math.abs(d.vx)<spd*.4)d.vx=(d.vx<0?-1:1)*spd*.4;if(Math.abs(d.vx)>mx)d.vx=(d.vx<0?-1:1)*mx;
    d.div.style.left=d.x+'px';d.div.style.top=d.y+'px';
    // wing flap
    d.wt+=dt;if(d.wt>80){d.wt=0;d.wf=(d.wf+1)%4;drawDuck(d.c.getContext('2d'),d.flip,d.col,d.wf<3?d.wf:1);}
  }
  raf=requestAnimationFrame(loop);
}

function renderHSDisplay(){
  var d=el('hs-display');
  if(d) d.textContent=highScore>0?'BEST: '+highScore:'';
}

function startGame(){
  for(var i=0;i<ducks.length;i++){try{if(ducks[i].div.parentNode)ducks[i].div.parentNode.removeChild(ducks[i].div);}catch(e){}}
  ducks=[];running=true;score=0;gameRound=1;wavesThisRound=0;ducksHit=0;shotsLeft=SHOTS_PER_WAVE;waveAlive=0;lastT=0;roundShotsFired=0;roundShotsMissed=0;
  el('sc').textContent='0';el('rd').textContent='1';renderShots();
  el('overlay').style.display='none';el('wb').style.display='none';el('quit-btn').style.display='none';
  stopDog();dogDead=false;
  // init weather canvas
  wxCanvas=el('wx');wxCtx=wxCanvas.getContext('2d');
  wxCanvas.width=wrap.offsetWidth;wxCanvas.height=wrap.offsetHeight;
  wxTick=0;
  applyScene(0);
  drawDog(el('dogc').getContext('2d'),0);
  // dog shoot listeners (add once — use flag to guard)
  var dogDiv=el('dog');
  dogDiv.ontouchstart=function(e){e.preventDefault();e.stopPropagation();shootDog();};
  dogDiv.onmousedown=function(e){e.stopPropagation();shootDog();};
  el('rb').textContent='ROUND 1';el('rb').className='show';
  setTimeout(function(){el('rb').className='';spawnWave();},1200);
  if(raf)cancelAnimationFrame(raf);
  raf=requestAnimationFrame(loop);
}

el('quit-btn').addEventListener('click',function(){
  running=false;if(raf)cancelAnimationFrame(raf);
  for(var i=0;i<ducks.length;i++){try{if(ducks[i].div.parentNode)ducks[i].div.parentNode.removeChild(ducks[i].div);}catch(e){}}
  ducks=[];stopDog();el('quit-btn').style.display='none';
  el('overlay').style.display='flex';
  if(score>highScore)highScore=score;
  el('overlay').innerHTML='<h1>GAME<br>OVER</h1><p>SCORE: '+score+'<br>ROUNDS: '+(gameRound-1)+'<br>DUCKS HIT: '+ducksHit+'<br>'+(score>=highScore?'<span style="color:#f5c842">&#x2605; NEW HIGH SCORE! &#x2605;</span>':'BEST: '+highScore)+'</p><button id="play-btn">PLAY AGAIN</button>';
  el('play-btn').addEventListener('click',function(){renderHSDisplay();startGame();});
});
el('play-btn').addEventListener('click',startGame);

wrap.addEventListener('touchstart',function(e){
  if(e.target.className==='duck'||e.target.tagName==='CANVAS')return;
  if(e.target.id==='play-btn'||e.target.id==='quit-btn')return;
  if(e.target.id==='back'||e.target.closest('#back'))return;
  e.preventDefault();
  var rect=wrap.getBoundingClientRect();
  onMiss(e.changedTouches[0].clientX-rect.left,e.changedTouches[0].clientY-rect.top);
},{passive:false});
wrap.addEventListener('mousedown',function(e){
  if(e.target.className==='duck'||e.target.tagName==='CANVAS')return;
  if(e.target.id==='play-btn'||e.target.id==='quit-btn')return;
  var rect=wrap.getBoundingClientRect();
  onMiss(e.clientX-rect.left,e.clientY-rect.top);
});
// Show high score on start screen now that all functions are defined
renderHSDisplay();

function onResize(){
  if(wxCanvas){
    var W=wrap.offsetWidth,H=wrap.offsetHeight;
    wxCanvas.width=W;wxCanvas.height=H;
    if(curScene)initClouds(W);
  }
  var W2=wrap.offsetWidth,H2=wrap.offsetHeight;
  var bot=H2*(1-GF)-52;
  for(var i=0;i<ducks.length;i++){
    var d=ducks[i];
    if(d.x>W2-52){d.x=W2-52;}
    if(d.y>bot){d.y=bot;}
    d.div.style.left=d.x+'px';
    d.div.style.top=d.y+'px';
    var ds=Math.min(W2,H2)*.09;
    d.div.style.width=ds+'px';d.div.style.height=ds+'px';
  }
}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',function(){setTimeout(onResize,150);});
</script>
